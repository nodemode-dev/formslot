[package]
name = "formslot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "formslot's engine: the corpus store, the index and the service. No window."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
getrandom = "0.4"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
blake3 = "1.8.7"
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
keyring = "4.2.0"
sqlite-vec = { version = "=0.1.9", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23"], optional = true }
tokenizers = { version = "=0.23.2", default-features = false, features = ["unstable_wasm"], optional = true }

[features]
dense = ["dep:sqlite-vec", "dep:ort", "dep:tokenizers"]
